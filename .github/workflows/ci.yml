# Runs the backend, frontend, and database checks on every pull request and on
# every push to main. ENVIRONMENT.md explains how to run the same checks locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck and tests)
    runs-on: ubuntu-latest
    # The tests take about 30 seconds locally; a run that hangs is stopped instead of
    # holding a runner for GitHub's default of 6 hours.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # No DATABASE_URL is set, so the tests use the in-memory database built from
      # supabase/migrations and supabase/seed. They never touch the hosted Supabase.
      - run: npm test

  frontend:
    name: Frontend (lint and build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mertofrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mertofrontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The build does not call the backend, so no backend is started here.
      - run: npm run build

  database:
    name: Database (migration and seed tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci
      - run: npm test
